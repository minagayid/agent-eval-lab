[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-eval-lab"
version = "0.1.0"
description = "Trace-based evaluation of tool-using agents"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.111,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.5,<1"]
postgres = ["psycopg[binary]>=3.2,<4"]

[project.scripts]
agent-eval = "agent_eval.cli:main"

[tool.setuptools.packages.find]
include = ["agent_eval*", "agents*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
